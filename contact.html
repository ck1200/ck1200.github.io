<body>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="logo.svg" alt="CK1200 Logo" class="logo">

        <ul>
            <li><a href="/">Home</a></li>

            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h1>Contact Us</h1>
        <p>Have questions, feedback, or suggestions? We'd love to hear from you!</p>

        <form action="https://formspree.io/f/movvrdql" method="POST">
            <input type="hidden" name="_subject" value="CK1200 Contact form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-info">
            <h2>Other Ways to Connect</h2>
            <ul>
                <li>Email: <a href="mailto:ck1200@proton.me">info@ck1200.com</a></li>
            </ul>
        </div>
    </main>

    <footer>&copy; 2025 CK1200</footer>
</body>
