<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK1200 - Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="game.css">
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7W25L6TVE3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-7W25L6TVE3');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2141208627733238"
        crossorigin="anonymous"></script>
    <style>
        /* Style for the fullscreen button */
        #fullscreenButton {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 8px; /* Reduced padding to better fit icon */
            border: none;
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color);
            transition: background-color 0.3s, transform 0.3s;
            z-index: 10;
            display: flex; /* Use flexbox to center icon */
            align-items: center;
            justify-content: center;
        }

        #fullscreenButton:hover {
            background-color: var(--accent-color);
            color: var(--card-bg);
            transform: scale(1.05);
        }

        #fullscreenButton:focus {
            outline: none;
            box-shadow: 0 4px 8px var(--accent-shadow-color);
        }

        /* Hide fullscreen button in fullscreen mode */
        .fullscreen #fullscreenButton {
            display: none;
        }

        /* Style for the fullscreen icon (Material Icons) */
        .material-symbols-outlined {
            font-size: 20px; /* Adjust icon size as needed */
            color: var(--text-color); /* Icon color same as text color */
            -webkit-font-smoothing: antialiased; /* Fix for Chrome blurry icons */
        }


        #fullscreenButton:hover .material-symbols-outlined {
            color: var(--card-bg); /* Icon color changes on hover */
        }
    </style>
</head>

<body>
    <nav>
        <a href="../index.html" class="logo-link">
            <img src="../logo.svg" alt="CK1200 Logo" class="logo">
        </a>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="index.html">Games</a></li>
            <li><a href="../about.html">About</a></li>
            <li><a href="../contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="game-container">
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
            <button id="fullscreenButton" onclick="toggleFullscreen()">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>
        </div>
    </main>

    <footer>&copy; 2025 CK1200</footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const mainElement = document.querySelector('main');
        const gameContainer = document.querySelector('.game-container');
        const gameFrame = document.getElementById('gameFrame');
        const fullscreenButton = document.getElementById('fullscreenButton');

        if (slug) {
            fetch('games.json')
                .then(response => response.json())
                .then(games => {
                    const currentGame = games.find(game => game.slug === slug);

                    if (currentGame) {
                        document.title = `CK1200 - ${currentGame.name}`;
                        let iframeSrc;

                        if (slug.startsWith("../projects/")) {
                            iframeSrc = `/${slug}/index.html`;
                        } else {
                            iframeSrc = `/games/${slug}/game/index.html`;
                        }
                        gameFrame.src = iframeSrc;
                    } else {
                        window.location.href = "404.html";
                    }
                })
                .catch(error => console.error('Error loading games:', error));
        } else {
            window.location.href = "index.html";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameContainer.classList.add('fullscreen');
                mainElement.classList.add('fullscreen');
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen();
                } else if (gameContainer.mozRequestFullScreen) {
                    gameContainer.mozRequestFullScreen();
                } else if (gameContainer.webkitRequestFullscreen) {
                    gameContainer.webkitRequestFullscreen();
                } else if (gameContainer.msRequestFullscreen) {
                    gameContainer.msRequestFullscreen();
                }
            } else {
                gameContainer.classList.remove('fullscreen');
                mainElement.classList.remove('fullscreen');
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                gameContainer.classList.remove('fullscreen');
                mainElement.classList.remove('fullscreen');
            }
        });
    </script>
</body>

</html>
