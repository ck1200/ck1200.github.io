        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-7W25L6TVE3');

<body>
    <nav>
        <a href="../index.html" class="logo-link">
            <img src="../logo.svg" alt="CK1200 Logo" class="logo">
        </a>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="index.html">Games</a></li>
            <li><a href="../about.html">About</a></li>
            <li><a href="../contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="game-container">
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </main>

    <footer>&copy; 2025 CK1200</footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
    
        if (slug) {
            const iframe = document.getElementById('gameFrame');
            let iframeSrc;
    
            if (slug.startsWith("../projects/")) {
                iframeSrc = `/${slug}/index.html`;
            } else {
                iframeSrc = `/games/${slug}/game/index.html`;
            }
            iframe.src = iframeSrc;
    
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
